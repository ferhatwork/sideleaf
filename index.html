<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="application-name" content="Sideleaf" />
    <meta name="apple-mobile-web-app-title" content="Sideleaf" />
    <meta name="description" content="Sideleaf — a tiny, local-first work surface for computer work. Open it. Capture thoughts. Keep working. Organize later." />
    <meta property="og:title" content="Sideleaf" />
    <meta property="og:description" content="Sideleaf — a tiny, local-first work surface for computer work." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sideleaf" />
    <meta name="twitter:description" content="Sideleaf — a tiny, local-first work surface for computer work." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sideleaf</title>
    <script>
      // Prevent theme flash (rendering-hydration-no-flicker)
      try {
        const stored = localStorage.getItem('sideleaf_ls_settings') || localStorage.getItem('workpad_ls_settings');
        if (stored) {
          const settings = JSON.parse(stored);
          const theme = settings.theme;
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (theme === 'system') {
            if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.remove('dark');
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-sideleaf-light-bg text-sideleaf-light-text dark:bg-sideleaf-dark-bg dark:text-sideleaf-dark-text antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register offline Service Worker
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
