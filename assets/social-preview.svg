<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Center Card -->
  <g filter="url(#cardShadow)">
    <rect x="240" y="100" width="800" height="440" rx="20" fill="#141822" stroke="#252b3b" stroke-width="1.5"/>
  </g>

  <!-- Leaf Icon Container -->
  <g transform="translate(588, 160)">
    <rect width="104" height="104" rx="26" fill="#1a202e" stroke="#2d374d" stroke-width="1.5"/>
    <!-- Leaf Icon scaled -->
    <path d="M29.25 74.75C29.25 47.125 48.75 27.625 74.75 29.25C76.375 55.25 56.875 74.75 29.25 74.75Z" fill="#3B82F6" fill-opacity="0.25" stroke="#3B82F6" stroke-width="6.5" stroke-linejoin="round"/>
    <path d="M29.25 74.75C43.875 60.125 58.5 45.5 74.75 29.25" stroke="#60A5FA" stroke-width="6.5" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="640" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="4" fill="#ffffff">SIDELEAF</text>

  <!-- Tagline -->
  <text x="640" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">A tiny, local-first work surface for computer work.</text>

  <!-- Feature Pills -->
  <g transform="translate(290, 430)">
    <!-- Pill 1: Local-First -->
    <rect x="0" y="0" width="160" height="38" rx="19" fill="#1b212f" stroke="#2c3547" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#10B981"/>
    <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">Local-First (IDB)</text>

    <!-- Pill 2: Fast Capture -->
    <rect x="175" y="0" width="165" height="38" rx="19" fill="#1b212f" stroke="#2c3547" stroke-width="1"/>
    <circle cx="195" cy="19" r="4" fill="#3B82F6"/>
    <text x="207" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">Instant Thought Capture</text>

    <!-- Pill 3: Offline Ready -->
    <rect x="355" y="0" width="170" height="38" rx="19" fill="#1b212f" stroke="#2c3547" stroke-width="1"/>
    <circle cx="375" cy="19" r="4" fill="#6366F1"/>
    <text x="387" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">PWA &amp; Offline Ready</text>

    <!-- Pill 4: Private -->
    <rect x="540" y="0" width="160" height="38" rx="19" fill="#1b212f" stroke="#2c3547" stroke-width="1"/>
    <circle cx="560" cy="19" r="4" fill="#8B5CF6"/>
    <text x="572" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">Zero Telemetry</text>
  </g>
</svg>
